name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts  # skip chromedriver download (browser tests not run in CI)
      - run: npx eslint lib/* examples/* test/**/* --ext .json
